# Cloud Build genérico del monorepo de landings.
# Un solo archivo para TODOS los sitios: cada trigger pasa _SITE / _SERVICE_NAME
# / _RUN_SA por --substitutions y filtra por --included-files=sites/<sitio>/**,
# de modo que un push solo reconstruye la landing que cambió.
#
# Deploy manual de un sitio:
#   gcloud builds submit --config=cloudbuild.yaml --project=consiti-landing-page \
#     --substitutions=_SITE=factura-ia,_SERVICE_NAME=odoo-factura-ia-landing,_RUN_SA=odoo-factura-ia-run@consiti-landing-page.iam.gserviceaccount.com .

substitutions:
  _REGION: us-central1
  _AR_REPO: cloud-run-source-deploy
  _SITE: ""          # carpeta en sites/  (lo fija el trigger)
  _SERVICE_NAME: ""  # servicio Cloud Run (lo fija el trigger)
  _RUN_SA: ""        # runtime SA del servicio (lo fija el trigger)

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

# El build context es sites/${_SITE}: solo se sube esa landing al builder,
# no las demás (evita arrastrar los videos de otros sitios).
steps:
  - id: build-and-push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        test -n "${_SITE}" -a -n "${_SERVICE_NAME}" -a -n "${_RUN_SA}" || { echo "faltan _SITE/_SERVICE_NAME/_RUN_SA"; exit 1; }
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}"
        TAG="${SHORT_SHA:-manual}"
        docker build -f Dockerfile -t "$$IMG:$$TAG" -t "$$IMG:latest" "sites/${_SITE}"
        docker push "$$IMG:$$TAG"
        docker push "$$IMG:latest"

  - id: deploy-cloud-run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMG="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_AR_REPO}/${_SERVICE_NAME}"
        TAG="${SHORT_SHA:-manual}"
        gcloud run deploy "${_SERVICE_NAME}" \
          --image "$$IMG:$$TAG" --region "${_REGION}" --platform managed \
          --port 8080 --service-account "${_RUN_SA}" \
          --cpu 1 --memory 256Mi --min-instances 0 --max-instances 5 --concurrency 200 \
          --allow-unauthenticated --quiet

timeout: 600s
