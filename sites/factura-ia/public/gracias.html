<style>
/* Variables y tokens: 1:1 con la landing (index.html:95-128). */
:root{
  --violeta:#5216E7;
  --violeta-hi:#8B62FF;
  --tinta:#140A2E;
  --nube:#F6F4FF;
  --papel:#FFFFFF;
  --noche:#0A0616;
  --gris:#544D6B;
  --gris-2:#6E6786;
  --linea:rgba(20,10,46,.12);
  --linea-osc:rgba(255,255,255,.15);
  --wa:#25D366;
  --wa-deep:#1eb355;
  --wa-ink:#140A2E;
  --cta-bg:var(--wa);
  --cta-bg-hover:var(--wa-deep);
  --cta-ink:var(--wa-ink);
  --cta-shadow:0 10px 26px -8px rgba(37,211,102,.6);
  --cta-shadow-hover:0 16px 34px -8px rgba(37,211,102,.7);
  --display:'Archivo',system-ui,sans-serif;
  --texto:'Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--noche);color:var(--tinta);font-family:var(--texto);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow-x:hidden;
}
/* Halo violeta del hero de la landing, atenuado, para que el fondo no sea plano */
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(760px 460px at 12% 2%,rgba(82,22,231,.36),transparent 66%),radial-gradient(600px 400px at 94% 92%,rgba(139,98,255,.2),transparent 68%)}
body:after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.35;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:74px 74px;mask-image:radial-gradient(880px 500px at 18% 8%,#000,transparent 72%);-webkit-mask-image:radial-gradient(880px 500px at 18% 8%,#000,transparent 72%)}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}

/* Tarjeta: mismo look que el modal del wizard (index.html .cw). */
.cw{
  position:relative;z-index:2;display:flex;flex-direction:column;width:100%;max-width:620px;
  background:var(--papel);color:var(--tinta);border-radius:22px;
  box-shadow:0 30px 80px -20px rgba(10,6,22,.6);overflow:hidden;
}
.cw-head{flex:none;padding:20px 24px 0}
.cw-head-row{display:flex;align-items:center;gap:12px;min-height:44px}
.mark{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;line-height:1}
.mark-logo{height:28px;width:auto;display:block}
.mark span{display:none}

.cw-body{padding:8px 24px 24px}

/* .cw-done: copiado 1:1 de index.html:777-784 */
.cw-done{padding:8px 0 4px;text-align:center}
.cw-done .ok{width:64px;height:64px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--violeta);box-shadow:0 10px 28px rgba(82,22,231,.35)}
.cw-done .ok svg{width:30px;height:30px;fill:none;stroke:#fff;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cw-done p{margin-top:10px;color:var(--gris);line-height:1.55;max-width:44ch;margin-left:auto;margin-right:auto;text-wrap:pretty}
.cw-done p b{color:var(--tinta)}
.cw-done .btn{margin-top:18px}
.cw-q{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.25rem,3.2vw,1.5rem);letter-spacing:-.02em;line-height:1.2;color:var(--tinta)}

.cw-bloqueo{padding:10px 14px;border-radius:12px;background:rgba(255,138,0,.1);border:1px solid rgba(255,138,0,.34);color:var(--tinta)}
.cw-bloqueo[hidden]{display:none}

/* Botón CTA verde WhatsApp (index.html:174-187) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-family:var(--texto);font-weight:700;font-size:1rem;letter-spacing:normal;line-height:1.25;text-decoration:none;border:0;cursor:pointer;border-radius:999px;padding:15px 28px;white-space:nowrap;background:var(--cta-bg);color:var(--cta-ink);box-shadow:var(--cta-shadow);transition:transform .2s cubic-bezier(.2,.7,.3,1),box-shadow .2s,background .2s}
.btn:hover{background:var(--cta-bg-hover);transform:translateY(-2px);box-shadow:var(--cta-shadow-hover)}
.btn:active{transform:translateY(1px)}
.btn svg{width:20px;height:20px;flex-shrink:0}

.cw-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px 18px;border-top:1px solid var(--linea);background:var(--papel);font-size:.86rem;color:var(--gris-2)}
.cw-foot a{color:var(--violeta);text-decoration:none}
.cw-foot a:hover{text-decoration:underline}

/* Móvil: pantalla completa como el modal en telefono */
@media(max-width:560px){
  body{padding:0;align-items:stretch}
  .cw{max-width:none;border-radius:0;min-height:100vh;min-height:100dvh}
  .cw-head{padding:14px 16px 0}
  .cw-body{padding:8px 16px 24px}
  .cw-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
}

a:focus-visible,button:focus-visible{outline:3px solid var(--violeta-hi);outline-offset:3px;border-radius:6px}
</style>
</head>

<body>
<main class="cw" role="main">
  <div class="cw-head">
    <div class="cw-head-row">
      <a class="mark" href="/" aria-label="Volver a FactuIA">
        <img class="mark-logo" src="assets/factuia-logo.svg" alt="FactuIA">
      </a>
    </div>
  </div>

  <div class="cw-body">
    <div class="cw-done">
      <div class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1 class="cw-q">¡Gracias! Ya casi está</h1>
      <p id="cw-done-msg">Un asesor le contactará muy pronto.</p>
      <p>Se abrió WhatsApp con su solicitud lista. <b>Presione enviar en WhatsApp</b> para que nos llegue.</p>
      <p class="cw-bloqueo" id="cw-bloqueo" hidden>Su navegador no dejó abrir WhatsApp. Presione el botón para abrirlo.</p>
      <a class="btn" id="wa-link" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.7-.8-2-.9-.3-.1-.5-.1-.7.1-.2.3-.8.9-1 1.1-.2.2-.4.2-.7.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6.1-.1.3-.4.4-.5.1-.2.2-.3.3-.5.1-.2 0-.4 0-.5 0-.1-.7-1.7-.9-2.3-.2-.6-.5-.5-.7-.5H7.5c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.3 5.2 4.6.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.7-.7 2-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.5 1.3 5L2 22l5.1-1.3c1.5.8 3.1 1.2 4.9 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
        Abrir WhatsApp
      </a>
    </div>
  </div>

  <div class="cw-foot">
    <span>© <span id="anio">2026</span> Grupo Consiti S.A. de C.V.</span>
    <a href="/">Volver al inicio</a>
  </div>
</main>

<script>
  document.getElementById('anio').textContent = new Date().getFullYear();

  /* Lectura de query params (el submit del wizard los envía) y sessionStorage
     con la URL de WhatsApp por si el popup fue bloqueado. */
  var qp = new URLSearchParams(location.search);
  var ctaId  = qp.get('cta') || '';
  var plan   = qp.get('plan') || '';
  var medio  = qp.get('medio') || '';
  var msg    = qp.get('msg') || '';
  var eventId= qp.get('eventId') || '';
  var waStored = '';
  try { waStored = sessionStorage.getItem('fx_wa_url') || ''; } catch(e) {}

  /* URL de WhatsApp para el botón de respaldo */
  var waHref = waStored
    || 'https://wa.me/50372559059?text=' + encodeURIComponent('Hola, vengo de la pagina de gracias de FactuIA y quisiera mas informacion, por favor.');
  document.getElementById('wa-link').href = waHref;

  /* Mensaje personalizado ("Un asesor le contactará por WhatsApp en la franja de la mañana…") */
  if (msg) {
    document.getElementById('cw-done-msg').textContent = msg;
  }

  /* Si venimos de un submit, mostramos el aviso "por si el popup fue bloqueado" */
  if (ctaId) {
    document.getElementById('cw-bloqueo').hidden = false;
  }

  /* ============ Conversion Google Ads ============
     TODO Daniela: pegar el "send_to" real cuando cree la accion de conversion
     en Google Ads (AW-18436887021 / <conversion_label>). Mientras tanto
     dejamos un evento GA4 propio ('conversion_lead') utilizable como
     conversion custom. */
  try {
    // gtag('event', 'conversion', { 'send_to': 'AW-18436887021/XXXXXXXXX', 'transaction_id': eventId });
    gtag('event', 'conversion_lead', { cta_id: ctaId, plan: plan, medio: medio, transaction_id: eventId });
  } catch(e) {}

  /* Meta Pixel Lead dedupeado (mismo eventID que se envió antes de navegar) */
  try {
    if (window.fbq) {
      var cd = { content_name: plan || 'Consulta general', content_category: 'ThankYou' };
      if (eventId) fbq('track', 'Lead', cd, { eventID: eventId });
      else fbq('track', 'Lead', cd);
    }
  } catch(e) {}

  /* dataLayer para GTM */
  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'thankyou_view', cta_id: ctaId, plan: plan, medio: medio });

  /* Limpiamos la URL guardada de WhatsApp una vez usada */
  try { sessionStorage.removeItem('fx_wa_url'); } catch(e) {}
</script>
</body>
