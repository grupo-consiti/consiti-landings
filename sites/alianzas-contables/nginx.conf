# Landing estática de una sola página (Programa de Alianzas Contables · FactuIA).
# Sirve index.html en / y las imágenes de public/fotos/.
# Sin redirects ni clean URLs; esta landing no los necesita.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens     off;
    absolute_redirect off;
    gzip       on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    location / { try_files $uri $uri/ =404; }
}

# Rebrand FactuIA: 301 del subdominio viejo al nuevo, conservando ruta y query.
# Solo actúa si el domain mapping de contadores.facturaiasv.com apunta a ESTE
# servicio. El bloque de arriba sigue siendo el default (primer server en :8080).
# Ver sites/factura-ia/docs/HANDOFF-REBRAND-FACTUIA.md.
server {
    listen       8080;
    server_name  contadores.facturaiasv.com;
    server_tokens off;
    return 301 https://contadores.factuiasv.com$request_uri;
}
