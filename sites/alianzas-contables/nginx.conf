# Landing de una sola página (Programa de Alianzas Contables · FactuIA).
# Sirve index.html en / y las imágenes de public/fotos/. Ahora también hace
# proxy_pass /api/* a un Node local (api/lead.js) que crea el lead en Odoo
# (landing_crm_api). Ver Dockerfile y entrypoint.sh.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens     off;
    absolute_redirect off;
    gzip       on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # /gracias -> gracias.html (clean URL para la thank-you page).
    location = /gracias      { try_files /gracias.html =404; }
    location = /gracias.html { return 301 /gracias; }

    # /api/ -> Node local (proxy). Sin buffers ni cache; el body vuelve al
    # cliente en cuanto Odoo responde.
    location /api/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering    off;
    }

    location / { try_files $uri $uri/ =404; }
}

# Rebrand FactuIA: 301 del subdominio viejo al nuevo, conservando ruta y query.
# Solo actúa si el domain mapping de contadores.facturaiasv.com apunta a ESTE
# servicio. El bloque de arriba sigue siendo el default (primer server en :8080).
# Ver sites/factura-ia/docs/HANDOFF-REBRAND-FACTUIA.md.
server {
    listen       8080;
    server_name  contadores.facturaiasv.com;
    server_tokens off;
    return 301 https://contadores.factuiasv.com$request_uri;
}
