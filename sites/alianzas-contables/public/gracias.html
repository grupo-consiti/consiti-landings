<style>
/* Tokens 1:1 con index.html de esta landing */
:root{
  --ink:#140A2E; --ink-soft:#655d7d; --ink-mute:#6E6786;
  --purple:#5216E7; --purple-deep:#3b0fb0; --purple-soft:#8b6cff;
  --paper:#FFFFFF; --lilac:#F6F4FF; --lilac-2:#EDE8FF; --night:#0A0616;
  --line:#E9E5F7; --line-soft:#F0EDFB;
  --r-md:14px; --r-lg:18px;
  --sh-purple:0 12px 32px -12px rgba(82,22,231,.45);
  --display:'Archivo',system-ui,sans-serif;
  --texto:'Instrument Sans',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--night);color:var(--ink);font-family:var(--texto);font-size:17px;line-height:1.6;
  -webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;padding:16px;position:relative;overflow-x:hidden;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(760px 460px at 12% 2%,rgba(82,22,231,.36),transparent 66%),radial-gradient(600px 400px at 94% 92%,rgba(139,108,255,.24),transparent 68%)}
img{max-width:100%;display:block}
a{color:inherit}
p{margin:0}

/* Tarjeta con el mismo look del modal .wz del wizard */
.wz{
  position:relative;z-index:2;display:flex;flex-direction:column;width:100%;max-width:560px;
  background:var(--paper);color:var(--ink);border-radius:var(--r-lg);
  box-shadow:0 30px 80px -20px rgba(10,6,22,.6);overflow:hidden;
}
.wz-head{flex:none;padding:20px 24px 0}
.wz-head-row{display:flex;align-items:center;gap:12px;min-height:44px}
.logo{display:flex;flex-direction:column;align-items:flex-start;text-decoration:none;line-height:1}
.logo img{height:28px;width:auto;display:block}
.logo .by{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-mute);margin-top:4px}

.wz-body{padding:8px 24px 24px}
.wz-done{text-align:center;padding:10px 0 4px}
.wz-done .ok{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,var(--purple),var(--purple-deep));box-shadow:var(--sh-purple)}
.wz-done .ok svg{width:30px;height:30px;stroke:#fff;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.wz-done h1{margin:0;font-family:var(--display);font-weight:800;font-size:clamp(1.3rem,3vw,1.6rem);letter-spacing:-.02em;line-height:1.2;color:var(--ink)}
.wz-done p{color:var(--ink-soft);margin-top:10px;line-height:1.55;max-width:44ch;margin-left:auto;margin-right:auto;text-wrap:pretty}
.wz-done p b{color:var(--ink)}

.wz-foot{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 24px 18px;border-top:1px solid var(--line);background:var(--paper);font-size:.86rem;color:var(--ink-mute)}
.wz-foot a{color:var(--purple);text-decoration:none}
.wz-foot a:hover{text-decoration:underline}

@media(max-width:560px){
  body{padding:0;align-items:stretch}
  .wz{max-width:none;border-radius:0;min-height:100vh;min-height:100dvh}
  .wz-head{padding:14px 16px 0}
  .wz-body{padding:8px 16px 24px}
  .wz-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
}

a:focus-visible,button:focus-visible{outline:3px solid var(--purple-soft);outline-offset:3px;border-radius:6px}
</style>

<body>
<main class="wz" role="main">
  <div class="wz-head">
    <div class="wz-head-row">
      <a class="logo" href="/" aria-label="Volver a FactuIA">
        <img src="fotos/logo-factuia-color-dark.png" alt="FactuIA">
        <span class="by">by Grupo Consiti</span>
      </a>
    </div>
  </div>

  <div class="wz-body">
    <div class="wz-done">
      <div class="ok" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
      <h1>¡Gracias! Ya casi está</h1>
      <p id="wz-done-msg">Un asesor del Programa de Alianzas Contables le contactará muy pronto.</p>
      <p>Le confirmaremos por el medio que eligió los siguientes pasos para dar de alta a sus clientes.</p>
    </div>
  </div>

  <div class="wz-foot">
    <span>© <span id="anio">2026</span> Grupo Consiti S.A. de C.V.</span>
    <a href="/">Volver al programa</a>
  </div>
</main>

<script>
  document.getElementById('anio').textContent = new Date().getFullYear();

  /* Query params que el submit del wizard puede haber pasado */
  var qp = new URLSearchParams(location.search);
  var perfil  = qp.get('perfil') || '';
  var medio   = qp.get('medio') || '';
  var msg     = qp.get('msg') || '';
  var eventId = qp.get('eventId') || '';

  if (msg) {
    document.getElementById('wz-done-msg').textContent = msg;
  }

  /* ============ Conversion Google Ads ============
     TODO Daniela: pegar el "send_to" real cuando cree la accion de conversion
     en Google Ads (AW-18436887021 / <conversion_label>). Mientras tanto,
     evento GA4 propio 'conversion_lead_contables' utilizable como conversion. */
  try {
    // gtag('event','conversion',{ send_to:'AW-18436887021/XXXXXXXXX', transaction_id: eventId });
    gtag('event','conversion_lead_contables',{ perfil: perfil, medio: medio, transaction_id: eventId });
  } catch(e) {}

  /* Meta Pixel Lead dedupeado (mismo eventID que se envio antes de navegar) */
  try {
    if (window.fbq) {
      var cd = { content_name: 'Alianzas Contables', content_category: perfil || 'Contador' };
      if (eventId) fbq('track', 'Lead', cd, { eventID: eventId });
      else fbq('track', 'Lead', cd);
    }
  } catch(e) {}

  window.dataLayer = window.dataLayer || [];
  window.dataLayer.push({ event: 'thankyou_view', landing: 'contables', perfil: perfil, medio: medio });
</script>
</body>
