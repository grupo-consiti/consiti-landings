# FactuIA landing · nginx en Cloud Run (escucha 8080, imagen no-root).
# Replica las reglas de vercel.json: clean URLs + 301 de rutas retiradas
# (docs/DESPLIEGUE-GCP.md §3). Solo se copian al contenedor index.html,
# terminos.html y assets/ — docs/, api/ y *.md nunca se sirven.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    charset      utf-8;

    server_tokens     off;
    absolute_redirect off;  # Location relativa: Cloud Run termina TLS y nginx solo ve http

    gzip       on;
    gzip_types text/css application/javascript image/svg+xml;

    # 301 heredados de vercel.json (los "#..." van entre comillas: # abre comentario en nginx)
    location = /faq        { return 301 "/#faq"; }
    location = /servicios  { return 301 /; }
    location = /consiti-ai { return 301 /; }
    location = /privacidad { return 301 "/terminos#s9"; }
    location = /sla        { return 301 /terminos; }

    # cleanUrls: /terminos.html -> /terminos, /index.html -> /
    location = /index.html   { return 301 /; }
    location ~ ^/(.+)\.html$ { return 301 /$1; }

    # / -> index.html servido directo por try_files (sin redirect interno a
    # /index.html, que caería en el 301 de arriba y haría loop).
    location = / { try_files /index.html =404; }

    # /terminos -> terminos.html (try_files sirve el archivo sin re-evaluar locations)
    # ponytail: sin Cache-Control explícito; nginx manda ETag/Last-Modified y el
    # navegador revalida. Añadir expires en /assets/ si el tráfico lo pide.
    location / { try_files $uri $uri.html =404; }
}

# Rebrand FactuIA: 301 del dominio viejo (facturaiasv.com) y de www al dominio
# nuevo, conservando ruta y query. Solo actúa si Cloud Run recibe ese Host, es
# decir, si el domain mapping del dominio viejo apunta a ESTE servicio. El bloque
# de arriba sigue siendo el default (primer server en :8080): run.app y
# factuiasv.com caen allí. Ver docs/HANDOFF-REBRAND-FACTUIA.md.
server {
    listen       8080;
    server_name  facturaiasv.com www.facturaiasv.com www.factuiasv.com;
    server_tokens off;
    return 301 https://factuiasv.com$request_uri;
}
