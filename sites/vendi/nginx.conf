# Landing estática de una sola página. Sirve index.html en / y los archivos de
# raíz (og-*.png, favicon.ico, apple-touch-icon.png) que Google/iPhone buscan.
# ponytail: sin redirects ni clean URLs; esta landing no los necesita.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;
    server_tokens     off;
    absolute_redirect off;
    gzip       on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    # noindex mientras vive en la URL temporal de Cloud Run (LEEME: activar en
    # direcciones de prueba). Se hace por header para NO editar el HTML del sitio.
    # QUITAR esta línea al mapear vendi.stradialabs.com (allí sí se quiere en Google).
    add_header X-Robots-Tag "noindex, nofollow" always;
    location / { try_files $uri $uri/ =404; }
}
